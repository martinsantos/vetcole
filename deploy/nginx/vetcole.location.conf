# Incluir dentro del bloque server { } de www.ultimamilla.com.ar.
# La app ya sabe que vive en /casos/vetcole/ (BASE_PATH), así que nginx NO recorta el prefijo.
location = /casos/vetcole { return 301 /casos/vetcole/; }

location ^~ /casos/vetcole/ {
    proxy_pass         http://127.0.0.1:4310;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
}
